name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck / Lint / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - name: Validate D1 migrations (local only)
        run: pnpm --filter @learwizai/api db:validate

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy worker + assets
        run: pnpm --filter @learwizai/api deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        run: |
          sleep 5
          BODY=$(curl -fsS --retry 3 --retry-delay 5 https://learnwizai-api-staging.orhankeskinn1.workers.dev/api/health)
          echo "$BODY"
          echo "$BODY" | jq -e '.status == "ok" and .environment == "staging" and .checks.db == "ok"' >/dev/null

  deploy-production:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: checks
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on the public repository (see docs/deployment.md)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy worker + assets
        run: pnpm --filter @learwizai/api deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          sleep 5
          BODY=$(curl -fsS --retry 3 --retry-delay 5 https://learnwizai-api.orhankeskinn1.workers.dev/api/health)
          echo "$BODY"
          echo "$BODY" | jq -e '.status == "ok" and .environment == "production" and .checks.db == "ok"' >/dev/null
